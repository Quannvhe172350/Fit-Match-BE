name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, develop]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: fitmatch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn verify -B

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write env file and copy to VM
        run: |
          cat > /tmp/fitmatch.env << EOF
          SPRING_PROFILES_ACTIVE=dev
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          GCS_BUCKET=${{ secrets.GCS_BUCKET }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          EOF

          gcloud compute scp /tmp/fitmatch.env ${{ secrets.GCE_INSTANCE }}:/tmp/fitmatch.env \
            --zone=${{ secrets.GCE_ZONE }} \
            --project=${{ secrets.GCE_PROJECT }} \
            --quiet

      - name: Deploy via gcloud SSH
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}:latest" | tr '[:upper:]' '[:lower:]')
          gcloud compute ssh ${{ secrets.GCE_INSTANCE }} \
            --zone=${{ secrets.GCE_ZONE }} \
            --project=${{ secrets.GCE_PROJECT }} \
            --quiet \
            --command="
              echo '${{ secrets.GHCR_PAT }}' | sudo docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin &&
              sudo docker pull ${IMAGE} &&
              sudo docker stop fitmatch || true &&
              sudo docker rm fitmatch || true &&
              sudo docker run -d \
                --name fitmatch \
                --restart unless-stopped \
                -p 8080:8080 \
                --env-file /tmp/fitmatch.env \
                ${IMAGE} &&
              sudo docker image prune -f &&
              rm /tmp/fitmatch.env
            "
