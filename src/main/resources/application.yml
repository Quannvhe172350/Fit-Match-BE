spring:
  application:
    name: fitmatch
  datasource:
    url: jdbc:mariadb://localhost:3306/fitmatch?createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: c29tZS1zZWN1cmUta2V5LWZvci1qd3Qtc2lnbmluZy1pbi1maXQtbWF0Y2gtYXBwbGljYXRpb24tdGhhdC1pcy0zMi1ieXRlcw==
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: "*"

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@fitmatch.app}
  gcs:
    enabled: ${GCS_ENABLED:false}
    bucket: ${GCS_BUCKET:fit-match}
    project-id: ${GCP_PROJECT_ID:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
