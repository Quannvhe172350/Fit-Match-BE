spring:
  application:
    name: fitmatch
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/fitmatch?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # Không có default: cấu hình qua biến môi trường hoặc application-local.yml (gitignored).
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB hiện hữu (schema do Hibernate tạo trước đây) được baseline tại V1,
    # chỉ chạy V2+; database trống chạy đủ từ V1.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # Bắt buộc cấu hình qua env (Base64, >= 32 bytes sau decode); không có default
  # để app fail-fast thay vì chạy với secret ai cũng biết. Secret cũ trong git
  # history coi như đã lộ — phải rotate.
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@fitmatch.app}
  gcs:
    enabled: ${GCS_ENABLED:false}
    bucket: ${GCS_BUCKET:fit-match}
    project-id: ${GCP_PROJECT_ID:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  # VietQR: tài khoản nhận tiền của nền tảng (khách chuyển khoản theo QR)
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970415}
    account-no: ${VIETQR_ACCOUNT_NO:113366668888}
    account-name: ${VIETQR_ACCOUNT_NAME:FIT MATCH}
    template: ${VIETQR_TEMPLATE:compact2}
  # Casso: dịch vụ đối soát biến động số dư ngân hàng, gọi webhook khi tiền vào.
  # Không có default: secret rỗng -> controller từ chối mọi webhook (fail-safe).
  casso:
    webhook-secret: ${CASSO_WEBHOOK_SECRET:}
  payment:
    order-ttl-hours: ${PAYMENT_ORDER_TTL_HOURS:24}
