spring:
  application:
    name: fitmatch
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/fitmatch?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # Mật khẩu mặc định chỉ để chạy dev/local (khớp MARIADB_ROOT_PASSWORD của docker).
    # Ở môi trường thật PHẢI set env DB_PASSWORD để override.
    password: ${DB_PASSWORD:root123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      # Hạn mức của tầng servlet, PHẢI lớn hơn app.media.max-image-size-mb — nếu
      # nhỏ hơn, request bị chặn trước khi vào controller và người dùng nhận lỗi
      # kỹ thuật thay vì thông báo "ảnh vượt quá N MB" của tầng nghiệp vụ.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:12MB}
      # Upload nhiều ảnh một lần: đủ cho max-files-per-request tấm ảnh.
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:80MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB hiện hữu (schema do Hibernate tạo trước đây) được baseline tại V1,
    # chỉ chạy V2+; database trống chạy đủ từ V1.
    baseline-on-migrate: true
    baseline-version: 1

server:
  # Thống nhất 8080 ở mọi profile (local/dev/prod/Docker đều 8080).
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # KHÔNG có default: bắt buộc set env JWT_SECRET (fail-fast khi thiếu).
  # Chạy local: dùng profile 'local' (application-local.yml, git-ignored) hoặc
  # export JWT_SECRET — sinh nhanh: openssl rand -base64 48
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # D-18 (chốt 2026-07-17, phương án A): số ngày được mở tranh chấp kể từ khi buổi tập
  # kết thúc (hoặc từ lúc booking bị hủy/từ chối). Đổi ở đây thì sửa cả
  # DISPUTE_WINDOW_DAYS phía FE (booking-pages) cho khớp thông báo/ẩn nút.
  dispute:
    open-window-days: ${DISPUTE_OPEN_WINDOW_DAYS:14}
  # Bug S2-09: số ngày khách được gửi yêu cầu hoàn tiền, tính từ khi buổi tập kết
  # thúc (hoặc từ lúc booking bị hủy/từ chối nếu chưa tới giờ tập). 0 = không giới hạn.
  # Chỉ áp cho khách; Admin mở hộ (UC-055) và luồng tự động không bị chặn.
  refund:
    request-window-days: ${REFUND_REQUEST_WINDOW_DAYS:7}
  mail:
    from: ${MAIL_FROM:noreply@fitmatch.app}
  gcs:
    enabled: ${GCS_ENABLED:false}
    bucket: ${GCS_BUCKET:fit-match}
    project-id: ${GCP_PROJECT_ID:}
    # Để trống ở môi trường Google Cloud -> dùng Application Default Credentials
    # (Workload Identity / metadata server), KHÔNG cần service account JSON.
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  # V64 — hệ thống ảnh dùng chung. Giới hạn để ở đây chứ không hằng số trong code:
  # dev cho phép ảnh to để test, prod siết lại theo hạn mức lưu trữ.
  media:
    max-image-size-mb: ${MAX_IMAGE_SIZE_MB:5}
    max-images-per-entity: ${MAX_IMAGES_PER_ENTITY:10}
    max-files-per-request: ${MAX_FILES_PER_REQUEST:10}
    allowed-mime-types: ${ALLOWED_IMAGE_MIME_TYPES:image/jpeg,image/png,image/webp}
    # true = bucket cho đọc ẩn danh (URL cố định, đặt được CDN).
    # false = bucket private, mọi URL đều được ký lại với thời hạn bên dưới.
    public-read: ${MEDIA_PUBLIC_READ:true}
    signed-url-ttl-minutes: ${MEDIA_SIGNED_URL_TTL_MINUTES:60}
    thumbnail-max-edge: ${MEDIA_THUMBNAIL_MAX_EDGE:400}
    # Ảnh đã upload nhưng người dùng bỏ dở form -> dọn sau ngần này giờ.
    orphan-retention-hours: ${MEDIA_ORPHAN_RETENTION_HOURS:24}
    cleanup-job-enabled: ${MEDIA_CLEANUP_JOB:true}
    cleanup-job-cron: ${MEDIA_CLEANUP_CRON:0 15 3 * * *}
  # VietQR: tài khoản nhận tiền của nền tảng (khách chuyển khoản theo QR)
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970418}
    account-no: ${VIETQR_ACCOUNT_NO:4271051065}
    account-name: ${VIETQR_ACCOUNT_NAME:FIT MATCH}
    template: ${VIETQR_TEMPLATE:compact2}
  # Casso: dịch vụ đối soát biến động số dư ngân hàng, gọi webhook khi tiền vào.
  # Webhook V2 — xác thực qua header X-Casso-Signature (HMAC-SHA256).
  # Không có default: secret rỗng -> controller từ chối mọi webhook (fail-safe).
  casso:
    webhook-secret: ${CASSO_WEBHOOK_SECRET:}
  payment:
    order-ttl-hours: ${PAYMENT_ORDER_TTL_HOURS:24}
  # UC-003: OAuth Client ID (loại Web application) dùng để kiểm tra claim `aud` của
  # ID token do FE gửi lên — phải TRÙNG với NEXT_PUBLIC_GOOGLE_CLIENT_ID của FE.
  # Không cần client secret. Nhiều client (web/Android/iOS) thì cách nhau bằng dấu phẩy.
  # Để trống -> /api/auth/google trả 503 GOOGLE_AUTH_DISABLED, FE tự ẩn nút Google.
  google-oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
  # UC-18 (V55): tìm phòng gym theo bán kính. Key SERVER dùng cho Geocoding API
  # (nên giới hạn theo IP) — khác key browser của FE dùng Maps JavaScript + Places.
  # Không set key -> mọi luồng geocode tự tắt, gym vẫn lưu địa chỉ nhưng không có toạ độ.
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    region: ${GOOGLE_MAPS_REGION:vn}
    language: ${GOOGLE_MAPS_LANGUAGE:vi}
    # Mở /api/marketplace/geocode cho khách vãng lai — chỉ bật khi FE KHÔNG có key
    # Maps JavaScript riêng, vì proxy công khai tiêu quota Google của nền tảng.
    public-geocode-enabled: ${GOOGLE_MAPS_PUBLIC_GEOCODE:false}
    max-search-radius-km: ${GYM_SEARCH_MAX_RADIUS_KM:50}
    default-search-radius-km: ${GYM_SEARCH_DEFAULT_RADIUS_KM:5}
    # V59 — đệm kết quả geocode trong DB để không trả tiền hai lần cho cùng một câu trả lời.
    cache-ttl-days: ${GEOCODE_CACHE_TTL_DAYS:90}
    # Job nền tự bổ sung toạ độ còn thiếu + làm mới toạ độ cũ. Mặc định TẮT: nó
    # tiêu quota Google mà không có ai nhìn. Chạy nhiều instance thì cần khoá phân tán.
    backfill-job-enabled: ${GEOCODE_BACKFILL_JOB:false}
    backfill-job-cron: ${GEOCODE_BACKFILL_CRON:0 30 3 * * *}
    backfill-job-limit: ${GEOCODE_BACKFILL_LIMIT:100}
    # Toạ độ cũ hơn ngần này ngày sẽ được tra lại THEO place_id; 0 = tắt làm mới.
    refresh-after-days: ${GEOCODE_REFRESH_AFTER_DAYS:180}
