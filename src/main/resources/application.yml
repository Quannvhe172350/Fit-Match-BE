spring:
  application:
    name: fitmatch
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/fitmatch?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # Mật khẩu mặc định chỉ để chạy dev/local (khớp MARIADB_ROOT_PASSWORD của docker).
    # Ở môi trường thật PHẢI set env DB_PASSWORD để override.
    password: ${DB_PASSWORD:root123}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB hiện hữu (schema do Hibernate tạo trước đây) được baseline tại V1,
    # chỉ chạy V2+; database trống chạy đủ từ V1.
    baseline-on-migrate: true
    baseline-version: 1

server:
  # Thống nhất 8080 ở mọi profile (local/dev/prod/Docker đều 8080).
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # KHÔNG có default: bắt buộc set env JWT_SECRET (fail-fast khi thiếu).
  # Chạy local: dùng profile 'local' (application-local.yml, git-ignored) hoặc
  # export JWT_SECRET — sinh nhanh: openssl rand -base64 48
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # D-18 (chốt 2026-07-17, phương án A): số ngày được mở tranh chấp kể từ khi buổi tập
  # kết thúc (hoặc từ lúc booking bị hủy/từ chối). Đổi ở đây thì sửa cả
  # DISPUTE_WINDOW_DAYS phía FE (booking-pages) cho khớp thông báo/ẩn nút.
  dispute:
    open-window-days: ${DISPUTE_OPEN_WINDOW_DAYS:14}
  mail:
    from: ${MAIL_FROM:noreply@fitmatch.app}
  gcs:
    enabled: ${GCS_ENABLED:false}
    bucket: ${GCS_BUCKET:fit-match}
    project-id: ${GCP_PROJECT_ID:}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
  # VietQR: tài khoản nhận tiền của nền tảng (khách chuyển khoản theo QR)
  vietqr:
    bank-bin: ${VIETQR_BANK_BIN:970415}
    account-no: ${VIETQR_ACCOUNT_NO:113366668888}
    account-name: ${VIETQR_ACCOUNT_NAME:FIT MATCH}
    template: ${VIETQR_TEMPLATE:compact2}
  # Casso: dịch vụ đối soát biến động số dư ngân hàng, gọi webhook khi tiền vào.
  # Không có default: secret rỗng -> controller từ chối mọi webhook (fail-safe).
  casso:
    webhook-secret: ${CASSO_WEBHOOK_SECRET:}
  payment:
    order-ttl-hours: ${PAYMENT_ORDER_TTL_HOURS:24}
  # UC-002: kênh gửi OTP SMS. Không set SMS_PROVIDER -> LoggingSmsService (log thay vì gửi).
  # SMS_PROVIDER=esms yêu cầu ESMS_API_KEY + ESMS_SECRET_KEY (https://esms.vn).
  sms:
    provider: ${SMS_PROVIDER:}
    esms:
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      brandname: ${ESMS_BRANDNAME:}
      # 2 = tin CSKH theo brandname; 8 = đầu số cố định
      sms-type: ${ESMS_SMS_TYPE:2}
